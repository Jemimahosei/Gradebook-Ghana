# Gradebook Ghana — prototype configuration.
# Datasource, semester and JWT secret all come from env vars with local
# demo defaults, so nothing secret lives in this file.
# On jem's Mac the defaults match her Postgres setup (database
# gradebook_ghana, user jemimahosei, empty password, port 5432).

spring.application.name=gradebook-ghana-backend
# Render (and most hosts) assign the port via $PORT; 8080 is the local default.
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gradebook_ghana}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:jemimahosei}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# The one active semester/term for the prototype. Read in exactly one place
# (GradebookProperties) — never hardcode a semester string in a controller.
gradebook.semester=2025/2026-1

# JWT signing secret. DEMO ONLY default — set JWT_SECRET to a long random
# value before any shared deploy. Must be at least 32 bytes for HS256.
gradebook.jwt-secret=${JWT_SECRET:gradebook-ghana-demo-secret-change-me-32bytes!!}

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
