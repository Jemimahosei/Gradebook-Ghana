# Gradebook Ghana — Render Blueprint.
# Creates: Docker backend web service + static frontend. The database is a
# free Neon Postgres instance (Render allows only one free Postgres per
# workspace and soup-db already uses that slot). Its connection string is
# set as DATABASE_URL in the Render dashboard (sync: false — never commit
# the value here). The backend reads DATABASE_URL via RenderDatabaseConfig,
# which converts it to a JDBC URL; JWT_SECRET is generated by Render. The
# frontend is built with REACT_APP_API_URL pointing at the backend service
# URL. Free tier: web services sleep when idle (slow first load, ~50s).
# Neon free tier has no 90-day expiry, but has storage/compute limits.

services:
  - type: web
    name: gradebook-backend
    env: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: gradebook-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/build
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: REACT_APP_API_URL
        value: https://gradebook-backend.onrender.com/api
