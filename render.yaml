# Gradebook Ghana — Render Blueprint.
# Creates: free Postgres database, Docker backend web service, static frontend.
# The backend reads DATABASE_URL (Render's postgres:// connection string) via
# RenderDatabaseConfig, which converts it to a JDBC URL; JWT_SECRET is
# generated by Render. The frontend is built with REACT_APP_API_URL pointing
# at the backend service URL. Free tier: web services sleep when idle (slow
# first load, ~50s) and the free database expires after 90 days.
databases:
  - name: gradebook-db
    plan: free
    databaseName: gradebook_ghana
    user: gradebook

services:
  - type: web
    name: gradebook-backend
    env: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gradebook-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: gradebook-frontend
    env: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/build
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: REACT_APP_API_URL
        value: https://gradebook-backend.onrender.com/api
